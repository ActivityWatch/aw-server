[tool.poetry]
name = "aw-server"
version = "0.14.0"
description = "Server for ActivityWatch"
authors = ["Erik Bjäreholt <erik@bjareho.lt>"]
license = "MPL-2.0"
include = ["aw_server/static/*"]

[tool.poetry.scripts]
aw-server = "aw_server:main"

[tool.poetry.dependencies]
python = "^3.9"
aw-core = { git = "https://github.com/ActivityWatch/aw-core.git", rev = "4496e2eec94af4ccf04b13be38d76d8eaaa49725" }
aw-client = "^0.5.8"
flask = "^3.1.3"
flask-restx = "^1.0.3"
flask-cors = "*"
importlib-metadata = {version = "*", python = "<3.10"}
werkzeug = ">=3.1.9,<4.0.0"

[tool.poetry.group.dev.dependencies]
mypy = "*"
pytest = ">=7.3,<9.0"
pytest-flask = "*"
pytest-benchmark = "*"
pytest-cov = "*"
types-Werkzeug = "*"
types-setuptools = "*"
types-Flask = "*"
black = ">=23.3,<25.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov-report=term --cov-report=xml --cov-report=html --cov=aw_server"
python_files = ["*.py",]

[tool.ruff]
# Match the minimum supported Python (tool.poetry.dependencies.python).
target-version = "py39"

[tool.ruff.lint]
# Preserve the existing baseline across changes to Ruff's default rule set.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
