name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# One run per workflow and ref. On PRs a new push cancels the superseded run.
# On master the running build finishes, and queued intermediates collapse to
# the newest commit, so a burst of merges doesn't queue a full build each.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: false
      SKIP_WEBUI: true
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is unavailable on Ubuntu 26.04 (ubuntu-latest).
        os: [ubuntu-22.04, windows-latest, macOS-latest]
        python_version: [3.9]
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python_version }}
    - name: Install dependencies
      shell: bash
      run: |
        pip install poetry==1.3.2  # due to: https://github.com/python-poetry/poetry/issues/7611
        python -m venv venv
        source venv/bin/activate || source venv/Scripts/activate
        make build
    - name: Run tests
      shell: bash
      run: |
        source venv/bin/activate || source venv/Scripts/activate
        make test
    - name: Report coverage
      shell: bash
      run: |
        # allow failures since codecov servers can be grumpy
        bash <(curl -s https://codecov.io/bash) || true
    - name: Package
      shell: bash
      run: |
        source venv/bin/activate || source venv/Scripts/activate
        pip install pyinstaller
        make package

  typecheck:
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: false
      SKIP_WEBUI: true
    strategy:
      matrix:
        # Keep the same Python 3.9-compatible Linux runner as the test job.
        os: [ubuntu-22.04]
        python_version: [3.9]
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python_version }}
    - name: Install dependencies
      shell: bash
      run: |
        pip install poetry
        python -m venv venv
        source venv/bin/activate || source venv/Scripts/activate
        make build
    - name: Typecheck
      shell: bash
      run: |
        source venv/bin/activate || source venv/Scripts/activate
        make typecheck
