[tool.poetry]
name = "aw-server"
version = "0.14.0"
description = "Server for ActivityWatch"
authors = ["Erik Bjäreholt <erik@bjareho.lt>"]
license = "MPL-2.0"
include = ["aw_server/static/*"]

[tool.poetry.scripts]
aw-server = "aw_server:main"

[tool.poetry.dependencies]
python = "^3.8"
# Draft dependency: ActivityWatch/aw-core#183 (stacked on schema #177).
aw-core = {git = "https://github.com/TimeToBuildBob/aw-core.git", rev = "4026a50e2ad191c43348c80ff5c34b010af5b2d6"}
aw-client = "^0.5.8"
flask = "^2.2"
flask-restx = "^1.0.3"
flask-cors = "*"
importlib-metadata = {version = "*", python = "<3.10"}
werkzeug = "^2.3.3"

[tool.poetry.group.dev.dependencies]
mypy = "*"
pytest = ">=7.3,<9.0"
pytest-flask = "*"
pytest-benchmark = "*"
pytest-cov = "*"
types-Werkzeug = "*"
types-setuptools = "*"
types-Flask = "*"
black = ">=23.3,<25.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov-report=term --cov-report=xml --cov-report=html --cov=aw_server"
python_files = ["*.py",]

[tool.ruff]
ignore = ["E402", "E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
